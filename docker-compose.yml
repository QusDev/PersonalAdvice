version: '3.8'
services:
  personal-advice-db:
    image: postgres:16-alpine
    container_name: personal-advice-postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: personal-advice
    ports:
      - "5433:5432"  
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: